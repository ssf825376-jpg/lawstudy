<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>LAWSTUDY — เรียนกฎหมายจากเหตุการณ์</title>

<style>
*{box-sizing:border-box}
:root{
  --main:#111111;
  --main2:#222222;
  --soft:#f4f4f4;
  --card:#ffffff;
  --text:#171717;
  --muted:#777;
  --line:#dedede;
  --accent:#111;
  --danger:#d7263d;
  --good:#16834a;
  --shadow:0 8px 25px rgba(0,0,0,.08);
}
body{
  margin:0;
  background:var(--soft);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans Thai",Tahoma,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.top{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--main);
  color:#fff;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 18px rgba(0,0,0,.2);
}
.logo{
  font-weight:900;
  font-size:23px;
  letter-spacing:.5px;
}
.top-right{
  display:flex;
  gap:8px;
}
.icon-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:21px;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.hero{
  background:var(--main);
  color:#fff;
  border-radius:28px;
  padding:32px 25px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}
.hero:after{
  content:"§";
  position:absolute;
  right:25px;
  bottom:-30px;
  font-size:180px;
  opacity:.07;
  font-weight:900;
}
.hero h1{
  font-size:40px;
  margin:0 0 8px;
}
.hero p{
  color:#ddd;
  margin:0;
  line-height:1.7;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:22px;
}
.stat{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.16);
  padding:14px;
  border-radius:17px;
}
.stat b{
  font-size:24px;
  display:block;
}
.stat span{
  color:#ccc;
  font-size:13px;
}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:28px 0 15px;
}
.section-title h2{
  margin:0;
  font-size:24px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow);
}
.category{
  transition:.18s;
}
.category:hover{
  transform:translateY(-2px);
}
.category-icon{
  font-size:34px;
}
.category h3{
  margin:10px 0 4px;
  color:var(--accent);
}
.small{
  color:var(--muted);
  font-size:14px;
}
.btn{
  border:0;
  background:var(--main);
  color:#fff;
  padding:11px 16px;
  border-radius:13px;
  font-weight:700;
}
.btn.light{
  background:var(--soft);
  color:var(--text);
  border:1px solid var(--line);
}
.btn.red{background:var(--danger)}
.btn.green{background:var(--good)}
.btn.full{
  width:100%;
}
.search{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  outline:none;
  margin-bottom:15px;
}
.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:5px;
  margin-bottom:15px;
}
.tab{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#fff;
  padding:9px 13px;
  border-radius:999px;
}
.tab.active{
  background:var(--main);
  color:#fff;
}
.event-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin-bottom:12px;
}
.badges{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.badge{
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  background:#eee;
}
.badge.sim{
  background:#eee;
}
.badge.real{
  background:#fff0d7;
}
.badge.law{
  background:#e8f1ff;
}
.event-title{
  font-size:19px;
  font-weight:800;
}
.event-story{
  line-height:1.75;
  color:#444;
  margin:8px 0 14px;
}
.reader{
  background:#fff;
  border-radius:25px;
  padding:22px;
  box-shadow:var(--shadow);
}
.reader h1{
  font-size:30px;
  margin:0 0 8px;
}
.article-box{
  background:#fafafa;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  line-height:1.8;
  margin:15px 0;
}
.source{
  border-left:4px solid var(--accent);
  background:#f7f7f7;
  padding:14px;
  border-radius:0 14px 14px 0;
  margin-top:15px;
}
.case{
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px;
  margin:10px 0;
  background:#fff;
}
.case strong{
  font-size:17px;
}
.case-summary{
  color:#555;
  line-height:1.7;
  margin:7px 0;
}
.warning{
  background:#fff8dd;
  border:1px solid #eadb92;
  border-radius:16px;
  padding:15px;
  line-height:1.7;
}
.goodbox{
  background:#ecfff4;
  border:1px solid #b8e9ca;
  border-radius:16px;
  padding:15px;
}
.quiz-question{
  font-size:19px;
  font-weight:800;
  line-height:1.7;
}
textarea{
  width:100%;
  min-height:150px;
  padding:14px;
  border-radius:15px;
  border:1px solid var(--line);
  resize:vertical;
  margin:12px 0;
}
.option{
  border:1px solid var(--line);
  background:#fff;
  padding:14px;
  border-radius:14px;
  margin:8px 0;
  width:100%;
  text-align:left;
}
.option.selected{
  border:2px solid var(--accent);
}
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.modal.show{display:flex}
.sheet{
  width:min(100%,900px);
  max-height:92vh;
  overflow:auto;
  background:var(--soft);
  border-radius:28px 28px 0 0;
  padding:20px;
  animation:up .2s ease;
}
@keyframes up{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}
.close{
  float:right;
  border:0;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ddd;
}
.palette{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.color{
  border:2px solid #fff;
  min-height:65px;
  border-radius:16px;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  color:#fff;
  font-weight:800;
  text-shadow:0 1px 2px #000;
}
.empty{
  text-align:center;
  color:#888;
  padding:30px 10px;
}
.footer{
  text-align:center;
  padding:35px 15px;
  color:#777;
  font-size:13px;
}
@media(max-width:700px){
  .container{padding:12px}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:32px}
}
</style>
</head>

<body>

<header class="top">
  <div class="logo">⚖️ LAWSTUDY</div>
  <div class="top-right">
    <button class="icon-btn" onclick="openPalette()">🎨</button>
    <button class="icon-btn" onclick="goHome()">⌂</button>
  </div>
</header>

<main class="container" id="app"></main>

<div class="modal" id="modal">
  <div class="sheet" id="modalContent"></div>
</div>

function buildSimulated(){
 let all=[];

 CATEGORIES.forEach(cat=>{
   let source=SIM_TEMPLATES[cat.id] || OTHER_TOPICS[cat.id] || [];

   for(let i=0;i<30;i++){
     let item=source[i % source.length];

     let title;
     let story;

     if(Array.isArray(item)){
       title=item[0];
       story=item[1];
     }else{
       title=item;
       story=`สถานการณ์ฝึกวิเคราะห์เกี่ยวกับ “${item}” โดยสมมติให้คู่กรณี A และ B มีข้อพิพาทเกิดขึ้น ผู้เรียนต้องวิเคราะห์ข้อเท็จจริงและกฎหมายที่เกี่ยวข้อง`;
     }

     all.push({
       id:`sim-${cat.id}-${i+1}`,
       category:cat.id,
       type:"จำลอง",
       no:i+1,
       title:title,
       story:story,
       difficulty:["ง่าย","ปานกลาง","ยาก","ระดับสอบ"][i%4],
       articles:cat.id==="criminal"
          ? [["288","289","290","291","294"][i%5]]
          : [],
       analysis:[
         "แยกข้อเท็จจริงที่สำคัญออกจากข้อเท็จจริงทั่วไป",
         "พิจารณาว่าการกระทำเข้าองค์ประกอบของกฎหมายหรือไม่",
         "พิจารณาข้อยกเว้นหรือเหตุยกเว้นความผิด",
         "ตรวจสอบมาตราที่เกี่ยวข้องก่อนสรุป"
       ]
     });
   }
 });

 return all;
}

 .map(c=>`

 </div>

function openCategory(id,mode="all"){

 state.category=id;
 state.eventType=mode;
 state.search="";
 state.page="category";

 renderCategory();
}

function renderCategory(){

 const cat=CATEGORIES.find(x=>x.id===state.category);

 let simulated=SIMULATED.filter(x=>x.category===state.category);

 let real=REAL_NEWS.filter(x=>x.category===state.category);

 let list=[];

 if(state.eventType==="sim") list=simulated;
 else if(state.eventType==="real") list=real;
 else list=[...simulated,...real];

 document.getElementById("app").innerHTML=`

 <div class="section-title">
   <h2>
     ${cat.icon} ${cat.name}
   </h2>

   <button class="btn light" onclick="goHome()">
     ← กลับ
   </button>
 </div>

 <div class="card">

   <input
     class="search"
     placeholder="🔎 ค้นหาเหตุการณ์..."
     value="${state.search}"
     oninput="filterEvents(this.value)"
   >

   <div class="tabs">
     <button class="tab ${state.eventType==="all"?"active":""}"
       onclick="setEventType('all')">
       ทั้งหมด
     </button>

     <button class="tab ${state.eventType==="sim"?"active":""}"
       onclick="setEventType('sim')">
       🧪 จำลอง 30
     </button>

     <button class="tab ${state.eventType==="real"?"active":""}"
       onclick="setEventType('real')">
       📰 เหตุการณ์จริง
     </button>

     <button class="tab"
       onclick="startQuiz('${state.category}')">
       🧠 ทำข้อสอบ
     </button>
   </div>

   <div id="eventList">
     ${eventList(list)}
   </div>

 </div>
 `;

}

function eventList(list){

 if(!list.length)
   return `<div class="empty">ยังไม่มีข้อมูลในหมวดนี้</div>`;

 return list.map(x=>{

   let isReal=x.type!=="จำลอง";

   return `

   <div class="event-card">

     <div class="badges">

       <span class="badge ${isReal?"real":"sim"}">
         ${isReal?"📰 เหตุการณ์จริง":"🧪 สถานการณ์จำลอง"}
       </span>

       ${
         x.difficulty
         ? `<span class="badge">ระดับ ${x.difficulty}</span>`
         :""
       }

       ${
         x.articles?.length
         ? `<span class="badge law">
              ม.${x.articles.join(" / ม.")}
            </span>`
         :""
       }

     </div>

     <div class="event-title">
       ${x.title}
     </div>

     <div class="event-story">
       ${x.story || x.summary}
     </div>

     ${
       isReal
       ? `<div class="small">
           📌 แหล่งข้อมูล: <b>${x.source}</b>
           ${x.date?` · ${x.date}`:""}
          </div>`
       :""
     }

     <br>

     <button class="btn"
       onclick="openEvent('${x.id}')">
       อ่านเหตุการณ์ →
     </button>

   </div>
   `;
 }).join("");
}

function setEventType(type){
 state.eventType=type;
 renderCategory();
}

function filterEvents(v){

 state.search=v.toLowerCase();

 let sim=SIMULATED.filter(x=>
   x.category===state.category &&
   (x.title+x.story).toLowerCase().includes(state.search)
 );

 let real=REAL_NEWS.filter(x=>
   x.category===state.category &&
   (x.title+x.summary+x.source).toLowerCase().includes(state.search)
 );

 let list=
   state.eventType==="sim"?sim:
   state.eventType==="real"?real:
   [...sim,...real];

 document.getElementById("eventList").innerHTML=eventList(list);
}

function startQuiz(category="criminal",article=null){

 let questions=QUIZ.filter(q=>q.category===category);

 if(article)
   questions=questions.filter(q=>q.article===article);

 if(!questions.length)
   questions=QUIZ.filter(q=>q.category==="criminal");

 /*
  คัด 8 ข้อ
  6 เขียน + 2 ตัวเลือก
 */

 let writes=questions.filter(q=>q.type==="write");
 let mcs=questions.filter(q=>q.type==="mc");

 let selected=[
   ...writes.slice(0,6),
   ...mcs.slice(0,2)
 ];

 selected=selected.sort(()=>Math.random()-.5);

 state.quiz=selected;
 state.quizIndex=0;
 state.score=0;

 renderQuiz();
}

function renderQuiz(){

 let q=state.quiz[state.quizIndex];

 if(!q){
   finishQuiz();
   return;
 }

 document.getElementById("app").innerHTML=`

 <div class="section-title">

   <h2>🧠 ห้องสอบ LAWSTUDY</h2>

   <button class="btn light" onclick="goHome()">
     ออกจากข้อสอบ
   </button>

 </div>

 <div class="card">

   <div class="badges">

     <span class="badge">
       ข้อ ${state.quizIndex+1}/${state.quiz.length}
     </span>

     <span class="badge law">
       ${
         q.type==="write"
         ?"✍️ เขียนตอบ"
         :"🔘 ตัวเลือก"
       }
     </span>

     <span class="badge">
       ม.${q.article}
     </span>

   </div>

   <div class="quiz-question">
     ${q.q}
   </div>

   ${
     q.type==="write"
     ?
     `
       <textarea
         id="answer"
         placeholder="เขียนแนวทางวิเคราะห์ของคุณ..."
       ></textarea>

       <button class="btn full"
         onclick="checkWritten()">
         ตรวจคำตอบ
       </button>
     `
     :
     `
       <div id="options">
         ${q.options.map((x,i)=>`
           <button
             class="option"
             onclick="chooseOption(${i})">
             ${String.fromCharCode(65+i)}. ${x}
           </button>
         `).join("")}
       </div>
     `
   }

 </div>
 `;

}

function checkWritten(){

 const q=state.quiz[state.quizIndex];

 const ans=
   document.getElementById("answer").value
   .toLowerCase();

 let hits=0;

 q.keywords.forEach(k=>{
   if(ans.includes(k.toLowerCase())) hits++;
 });

 let correct=hits>=Math.max(1,Math.ceil(q.keywords.length*.45));

 showQuizResult(correct,q,
   `ตรวจพบประเด็นสำคัญ ${hits}/${q.keywords.length} จุด`
 );
}

function chooseOption(i){

 const q=state.quiz[state.quizIndex];

 const correct=i===q.answer;

 showQuizResult(correct,q,
   correct
   ?"เลือกคำตอบถูกต้อง"
   :"คำตอบยังไม่ถูกต้อง"
 );
}

function showQuizResult(correct,q,message){

 if(correct)state.score++;

 document.getElementById("app").innerHTML=`

 <div class="card">

   ${
     correct
     ?
     `<div class="goodbox">
        ✅ <b>ตอบถูก</b><br>
        ${message}
      </div>`
     :
     `<div class="warning">
        ❌ <b>คำตอบยังไม่ถูกต้อง</b><br>
        ${message}
      </div>`
   }

   <h3>📖 กลับไปดูมาตรา ${q.article}</h3>

   <div class="article-box">

     <b>${ARTICLES[q.article]?.title||"มาตราที่เกี่ยวข้อง"}</b>

     <p>
       ${ARTICLES[q.article]?.summary||
       "ควรตรวจสอบองค์ประกอบของกฎหมายจากแหล่งตัวบทก่อนสรุปคำตอบ"}
     </p>

   </div>

   <h3>⚖️ ฎีกาที่เกี่ยวข้อง</h3>

   ${
     (DEKA[q.article]||[]).map(c=>`
       <div class="case">
         <b>ฎีกาที่ ${c.no}</b>
         <p class="small">${c.summary}</p>
       </div>
     `).join("")
     ||
     `<div class="empty">
       ยังไม่มีฎีกาที่ตรวจสอบแล้วในคลังสำหรับข้อนี้
     </div>`
   }

   <br>

   <button
     class="btn"
     onclick="openArticle('${q.article}')">
     📖 อ่านมาตรา ${q.article}
   </button>

   <br><br>

   <button
     class="btn green"
     onclick="nextQuiz()">
     ข้อต่อไป →
   </button>

 </div>

 `;
}

function nextQuiz(){

 state.quizIndex++;

 renderQuiz();
}

function finishQuiz(){

 let percent=
   Math.round(
     state.score/state.quiz.length*100
   );

 document.getElementById("app").innerHTML=`

 <div class="card" style="text-align:center">

   <div style="font-size:60px">🏆</div>

   <h1>จบแบบทดสอบ</h1>

   <h2>${state.score}/${state.quiz.length}</h2>

   <p>
     ได้คะแนนประมาณ ${percent}%
   </p>

   <button
     class="btn"
     onclick="startQuiz('criminal')">
     ทำใหม่
   </button>

   <br><br>

   <button
     class="btn light"
     onclick="goHome()">
     กลับหน้าแรก
   </button>

 </div>

 `;
}

 ["ส้ม","#ea580c","#9a3412"],
 ["เหลือง","#b58900","#725900"],
 ["ฟ้า","#0891b2","#155e75"],
 ["กรมท่า","#172554","#0f172a"],
 ["เทา","#4b5563","#1f2937"]
];

function openPalette(){

 openModal(`

 <button class="close" onclick="closeModal()">×</button>

 <h2>🎨 เลือกสี LAWSTUDY</h2>

 <div class="palette">

 ${
   THEMES.map((t,i)=>`

   <button
     class="color"
     style="background:${t[1]}"
     onclick="setTheme(${i})">
     ${t[0]}
   </button>

   `).join("")
 }

 </div>
 `);
}

function setTheme(i){

 const t=THEMES[i];

 document.documentElement.style.setProperty("--main",t[1]);
 document.documentElement.style.setProperty("--main2",t[2]);
 document.documentElement.style.setProperty("--accent",t[1]);

 localStorage.setItem("lawstudy-theme",i);

 closeModal();
}

function loadTheme(){

 const i=
   Number(localStorage.getItem("lawstudy-theme"));

 if(Number.isInteger(i)&&THEMES[i])
   setTheme(i);
}


/* -------------------------
   MODAL
------------------------- */

function openModal(html){

 document.getElementById("modalContent").innerHTML=html;

 document.getElementById("modal").classList.add("show");

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click",e=>{
 if(e.target.id==="modal")
   closeModal();
});


/* -------------------------
   HOME
------------------------- */

function goHome(){
 closeModal();
 renderHome();
 window.scrollTo(0,0);
}
